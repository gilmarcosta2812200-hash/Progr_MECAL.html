            let html = '<div style="display: flex; flex-direction: column; gap: 20px;">';
            
            recursosMapeados.forEach((rec, index) => {
                let itens = d.filter(x => x.RECURSO === rec.codClean);
                let blockId = `grade-rec-${index}`;
                
                html += `<div class="recurso-bloco">
                            <div class="recurso-tarja" onclick="AlternarRecurso('${blockId}')" title="Clique para ocultar/mostrar operações">
                                <span><i id="icon-${blockId}" class="fa-solid fa-chevron-up"></i> &nbsp; <i class="fa-solid fa-industry"></i> &nbsp;${rec.fullStr}</span>
                                <span class="op-count">${itens.length} op(s)</span>
                            </div>
                            <div class="recurso-cards-grid" id="${blockId}">`;
                
                itens.forEach(i => {
                    let isFin = String(i.REALIZADO).toUpperCase().includes("FINALIZADO") || String(i.REALIZADO).toUpperCase() === "M";
                    html += `
                    <div class="kanban-card ${isFin ? 'status-finalizado' : ''}">
                        <span class="green-dot-card"></span>
                        <div class="card-header-code">
                            <span>Cód: #${i.COD || '—'}</span>
                            <span class="badge-week">${i.SEMANA}</span>
                        </div>
                        <div class="card-body-desc">${i.DESCRICAO || 'Sem descrição cadastrada'}</div>
                        <div class="card-footer-info">
                            <div style="margin-bottom:4px;">Op: <b>${i.OPERACAO || '—'}</b></div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span class="badge-client">${i.CLIENTE || '—'}</span>
                                <span class="badge-finalizado-tag">EXECUTADA</span>
                            </div>
                        </div>
                    </div>`;
                });
                html += '</div></div>';
            });
            t.innerHTML = recursosMapeados.length ? html+'</div>' : '<div class="state-empty"><p>Nenhuma ordem de produção atende aos critérios deste filtro.</p></div>';
        }

        function TabCarteiraGeral(t, data) {
            let linesHtml = '';
            data.forEach(item => {
                let statusUpper = String(item.STATUS).toUpperCase();
                let isFinalizado = statusUpper.includes("FINALI") || statusUpper.includes("CONCLU") || statusUpper.includes("PRONTO");
                let classeLinha = isFinalizado ? 'row-finalizado' : '';
                let bolinhaVerde = isFinalizado ? '<span class="green-dot-table"></span>' : '';

                linesHtml += `
                <tr class="${classeLinha}">
                    <td>${item.CLIENTES || '—'}</td>
                    <td>${item.DESCRICAO || '—'}</td>
                    <td>${item.UNID || '—'}</td>
                    <td>${item.COD_PC || '—'}</td>
                    <td>${item.QTD || '—'}</td>
                    <td>${item.SUB_GRUPO || '—'}</td>
                    <td>${item.SETOR_VENDA || '—'}</td>
                    <td>${item.PRAZO_FUNDIDO || '—'}</td>
                    <td>${item.PRAZO_ENTREGA || '—'}</td>
                    <td>${item.MES ? item.MES.toUpperCase() : '—'}</td>
                    <td class="cell-relative">${item.STATUS || '—'}${bolinhaVerde}</td>
                </tr>`;
            });

            t.innerHTML = `
            <div class="table-container">
                <table class="tabela-base">
                    <thead>
                        <tr>
                            <th>Clientes</th>
                            <th>Descrição</th>
                            <th>Unid.</th>
                            <th>CÓD_PÇ</th>
                            <th>Qtd.</th>
                            <th>Sub_Grupo</th>
                            <th>Setor_Venda</th>
                            <th>Prazo Fundido</th>
                            <th>Prazo Entrega</th>
                            <th>Mês</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${linesHtml || '<tr><td colspan="11" style="text-align:center; padding:30px; color:var(--text-muted);">Nenhum registro encontrado para os filtros selecionados.</td></tr>'}
                    </tbody>
                </table>
            </div>`;
        }

        function TabMatriz(t) {
            let chaves = Object.keys(MATRIZ_CARGA).sort((a,b) => parseInt(a) - parseInt(b));
            if (chaves.length === 0) { t.innerHTML = '<div class="state-empty"><p>Sem dados de capacidade disponíveis.</p></div>'; return; }

            // Filtro de Recursos: aplica o texto digitado em "Filtrar recursos por
            // nome ou código..." contra o código do recurso e o nome da máquina.
            let filtroRecurso = (document.getElementById('filtroRecursoMatriz')?.value || '').trim().toLowerCase();
            if (filtroRecurso) {
                chaves = chaves.filter(cc => {
                    let nome = (MATRIZ_CARGA[cc].nome || '').toLowerCase();
                    return cc.toLowerCase().includes(filtroRecurso) || nome.includes(filtroRecurso);
                });
            }
            if (chaves.length === 0) { t.innerHTML = '<div class="state-empty"><p>Nenhum recurso encontrado para o filtro informado.</p></div>'; return; }

            let sems = MATRIZ_CARGA[Object.keys(MATRIZ_CARGA)[0]].semanas;
            let valIni = document.getElementById('filtroMatrizInicio').value;
            let valFim = document.getElementById('filtroMatrizFim').value;
            let idxIni = sems.indexOf(valIni), idxFim = sems.indexOf(valFim);
            
            if(idxIni === -1) idxIni = 0;
            if(idxFim === -1 || idxFim < idxIni) idxFim = sems.length - 1;
            let semsFiltradas = sems.slice(idxIni, idxFim + 1);
            
            let htmlTable = `<table class="matriz-table"><thead><tr><th style="min-width: 250px;">RECURSO</th>${semsFiltradas.map(s => {
                let { semana: wSem, ano: wAno } = extrairSemanaEAno(s, '2026');
                return `<th><span class="th-semana">${wSem}</span><span class="th-ano">${wAno}</span></th>`;
            }).join('')}</tr></thead><tbody>`;

            chaves.forEach(cc => {
                let m = MATRIZ_CARGA[cc]; 
                htmlTable += `<tr><td>[${cc}] ${m.nome}</td>`;
                let codRecursoNormalizado = normalizarRecurso(cc);
                
                for(let i = idxIni; i <= idxFim; i++) {
                    let cap = m.capacidade[i] || 1;

                    // Extrai semana E ano reais desta coluna uma única vez (usado na célula)
                    let { semana: semLimpa, ano: anoLimpa } = extrairSemanaEAno(sems[i], '2026');

                    // CARGA (horas previstas) é calculada DINAMICAMENTE somando as operações
                    // reais da aba BASE (via INDICE_CELULA) — não lida mais do valor estático
                    // da aba "CARGA MÁQUINA (PLANEJ)" (m.carga), que fica desatualizado sempre
                    // que a aba BASE muda mas essa planilha auxiliar não é recalculada. Assim a
                    // Matriz sempre bate com o que o modal de detalhes mostra (mesma fonte).
                    let opsCelula = INDICE_CELULA[`${codRecursoNormalizado}_${semLimpa}_${anoLimpa}`] || [];
                    let carga = opsCelula.reduce((acc, op) => acc + (Number(op.hrPrev) || 0), 0);
                    let pct = Math.round((carga / cap) * 100);
                    let cls = "cell-livre", txt = "Livre";

                    if (pct > 0 && pct <= 85) { cls = "cell-ok"; txt = pct + "%"; } 
                    else if (pct > 85 && pct <= 100) { cls = "cell-alert"; txt = pct + "%"; } 
                    else if (pct > 100) { cls = "cell-danger"; txt = pct + "%"; }
                    
                    // Célula clicável: guarda só os identificadores. A busca das operações
                    // acontece no clique, consultando o índice pré-construído (O(1)).
                    let dataAttrs = '';
                    if (pct > 0) {
                        let nomeSeguro = String(m.nome || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        cls += " matriz-cell-click";
                        dataAttrs = ` data-recurso-id="${codRecursoNormalizado}" data-recurso-nome="${nomeSeguro}" data-semana-num="${semLimpa}" data-ano="${anoLimpa}" data-pct="${pct}" data-cap="${cap}"`;
                    }

                    htmlTable += `<td class="${cls}"${dataAttrs}>${txt}</td>`;
                }
                htmlTable += `</tr>`;
            });
            
            htmlTable += `</tbody></table>`;

            t.innerHTML = `<div class="matriz-table-wrapper">${htmlTable}</div>`;
        }

        /* ==========================================================
           4. PROGRAMAÇÃO CAPACITADA — Agente de PCP (ver Especificação Técnica)
           ========================================================== */
        let modoVisualizacaoCapacitada = 'RECURSO'; // 'RECURSO' (combinação por máquina) ou 'LISTA' (fila completa)

        function AlternarVisaoCapacitada(modo) {
            modoVisualizacaoCapacitada = modo;
            RenderizarAtual();
        }

        function TabProgramacaoCapacitada(t) {
            let selCap = document.getElementById('filtroSemanaCapacitada');
            if (!selCap || !selCap.value) {
                t.innerHTML = '<div class="state-empty"><p>Sem dados de capacidade disponíveis para simular a programação.</p></div>';
                return;
            }
            let [semanaAlvo, anoAlvo] = selCap.value.split('|');
            let criterio = document.getElementById('filtroCriterioCapacitada').value;

            let resultado = CalcularProgramacaoCapacitada(semanaAlvo, anoAlvo, criterio);
            let { fila, indicadores } = resultado;

            let kpisHtml = `
                <div class="cap-kpis-grid">
                    <div class="cap-kpi-card cap-kpi-danger">
                        <div class="cap-kpi-label"><i class="fa-solid fa-triangle-exclamation"></i> Gargalos Identificados</div>
                        <div class="cap-kpi-valor">${indicadores.gargalos}</div>
                        <div class="cap-kpi-sub">Ordens liberadas cujo tempo excede o saldo da máquina</div>
                    </div>
                    <div class="cap-kpi-card cap-kpi-azul">
                        <div class="cap-kpi-label"><i class="fa-solid fa-layer-group"></i> Carga Alocada Sugerida</div>
                        <div class="cap-kpi-valor">${indicadores.cargaAlocadaSugerida}h</div>
                        <div class="cap-kpi-sub">Total de horas adicionais sugeridas para aprovação</div>
                    </div>
                    <div class="cap-kpi-card cap-kpi-amarelo">
                        <div class="cap-kpi-label"><i class="fa-solid fa-industry"></i> Alertas de Fundido</div>
                        <div class="cap-kpi-valor">${indicadores.alertasFundido}</div>
                        <div class="cap-kpi-sub">Itens com entrega na semana mas fundido não liberado</div>
                    </div>
                    <div class="cap-kpi-card cap-kpi-verde">
                        <div class="cap-kpi-label"><i class="fa-solid fa-check-double"></i> Etapas Concluídas</div>
                        <div class="cap-kpi-valor">${indicadores.etapasConcluidas}</div>
                        <div class="cap-kpi-sub">Linhas com CONTR. DE ATUALIZ. = 1 nesta semana</div>
                    </div>
                </div>`;

            let toggleHtml = `
                <div class="cap-toggle-visao">
                    <button class="cap-toggle-btn ${modoVisualizacaoCapacitada === 'RECURSO' ? 'active' : ''}" onclick="AlternarVisaoCapacitada('RECURSO')">
                        <i class="fa-solid fa-diagram-project"></i> Combinação por Recurso
                    </button>
                    <button class="cap-toggle-btn ${modoVisualizacaoCapacitada === 'LISTA' ? 'active' : ''}" onclick="AlternarVisaoCapacitada('LISTA')">
                        <i class="fa-solid fa-list"></i> Fila Completa
                    </button>
                    <span class="cap-toggle-legenda">Prioridade calculada por ${criterio === 'HORAS' ? 'maiores horas previstas' : 'menor prazo de entrega'} — inclui atrasados de semanas anteriores ainda não baixados.</span>
                </div>`;

            let corpoHtml = (modoVisualizacaoCapacitada === 'RECURSO')
                ? RenderizarCombinacaoPorRecurso(resultado, semanaAlvo, anoAlvo)
                : RenderizarFilaCompleta(fila, semanaAlvo, anoAlvo);

            t.innerHTML = `${kpisHtml}${toggleHtml}${corpoHtml}`;
        }

        // Renderiza a fila completa (visão em lista única, ordenada por prioridade).
        function RenderizarFilaCompleta(fila, semanaAlvo, anoAlvo) {
            let linhasHtml = '';
            if (fila.length === 0) {
                linhasHtml = `<tr><td colspan="9" style="text-align:center; padding:30px; color:var(--text-muted);">Nenhuma operação pendente encontrada até a semana ${semanaAlvo}/${anoAlvo}.</td></tr>`;
            } else {
                fila.forEach(item => {
                    let badgeClasse = { SUGERIDO: 'cap-badge-verde', GARGALO: 'cap-badge-vermelho', BLOQUEADO: 'cap-badge-cinza' }[item.statusSugestao] || '';
                    let iconeFundido = item.fundidoLiberado
                        ? '<i class="fa-solid fa-circle-check" style="color:#22543D;"></i>'
                        : '<i class="fa-solid fa-circle-xmark" style="color:#9B2C2C;"></i>';
                    let nomeRecurso = (MATRIZ_CARGA[item.recursoId] || {}).nome || '';
                    let tagAtrasado = item.atrasado ? `<span class="cap-tag-atrasado" title="Backlog de ${escapeHtml(item.semanaOrigemTexto)}">⏱ ${escapeHtml(item.semanaOrigemTexto)}</span>` : '';
                    linhasHtml += `
                        <tr>
                            <td style="text-align:left;">${escapeHtml(item.cliente)}</td>
                            <td style="text-align:left;">#${escapeHtml(item.cod)}</td>
                            <td style="text-align:left;">[${escapeHtml(item.recursoId)}] ${escapeHtml(nomeRecurso)}</td>
                            <td>${item.hrPrev.toFixed(1)}h</td>
                            <td>${iconeFundido} ${escapeHtml(item.fundidoTexto)}</td>
                            <td>${escapeHtml(item.prazoEntregaTexto)} ${tagAtrasado}</td>
                            <td><span class="cap-badge ${badgeClasse}">${item.statusSugestao}</span></td>
                            <td style="text-align:left; font-size:11px; color:var(--text-muted);">${escapeHtml(item.motivo)}</td>
                        </tr>`;
                });
            }

            return `
                <div class="matriz-table-wrapper" style="margin-top:14px;">
                    <table class="matriz-table" style="font-size:12px;">
                        <thead><tr>
                            <th style="text-align:left;">Cliente</th>
                            <th style="text-align:left;">Cód.</th>
                            <th style="text-align:left;">Recurso</th>
                            <th>HR Prev.</th>
                            <th>Fundido</th>
                            <th>Prazo Entrega</th>
                            <th>Status</th>
                            <th style="text-align:left;">Motivo</th>
                        </tr></thead>
                        <tbody>${linhasHtml}</tbody>
                    </table>
                </div>`;
        }

        // Renderiza a "sugestão de combinação de operações por recurso": um card por
        // máquina, com a lista de itens escolhidos (já na ordem de prioridade por Prazo
        // de Entrega ou Horas) que cabem no saldo daquela semana, e uma barra mostrando
        // o quanto da capacidade a combinação sugerida ocupa.
        function RenderizarCombinacaoPorRecurso(resultado, semanaAlvo, anoAlvo) {
            let grupos = AgruparSugestaoPorRecurso(resultado);

            if (grupos.length === 0) {
                return `<div class="state-empty"><p>Nenhuma operação pendente encontrada até a semana ${semanaAlvo}/${anoAlvo}.</p></div>`;
            }

            let cardsHtml = grupos.map(g => {
                let pct = g.capacidadeInicial ? Math.round((g.horasSugeridas / g.capacidadeInicial) * 100) : 0;
                let corBarra = pct > 100 ? '#C0392B' : (pct >= 85 ? '#B8860B' : '#1E7B34');

                let linhasItens = g.itens.map(item => {
                    let badgeClasse = { SUGERIDO: 'cap-badge-verde', GARGALO: 'cap-badge-vermelho', BLOQUEADO: 'cap-badge-cinza' }[item.statusSugestao] || '';
                    let iconeFundido = item.fundidoLiberado
                        ? '<i class="fa-solid fa-circle-check" style="color:#22543D;"></i>'
                        : '<i class="fa-solid fa-circle-xmark" style="color:#9B2C2C;"></i>';
                    let tagAtrasado = item.atrasado ? `<span class="cap-tag-atrasado" title="Backlog de ${escapeHtml(item.semanaOrigemTexto)}">⏱ ${escapeHtml(item.semanaOrigemTexto)}</span>` : '';
                    return `
                        <tr class="${item.statusSugestao === 'SUGERIDO' ? 'cap-linha-sugerida' : ''}">
                            <td style="text-align:left;">${escapeHtml(item.cliente)}</td>
                            <td style="text-align:left;">#${escapeHtml(item.cod)}</td>
                            <td>${item.hrPrev.toFixed(1)}h</td>
                            <td>${iconeFundido} ${escapeHtml(item.fundidoTexto)}</td>
                            <td>${escapeHtml(item.prazoEntregaTexto)} ${tagAtrasado}</td>
                            <td><span class="cap-badge ${badgeClasse}">${item.statusSugestao}</span></td>
                        </tr>`;
                }).join('');

                let resumoExtra = [];
                if (g.qtdGargalo > 0) resumoExtra.push(`${g.qtdGargalo} em gargalo`);
                if (g.qtdBloqueado > 0) resumoExtra.push(`${g.qtdBloqueado} bloqueado(s) por fundido`);

                return `
                    <div class="cap-recurso-card">
                        <div class="cap-recurso-header">
                            <div class="cap-recurso-nome">[${escapeHtml(g.recursoId)}] ${escapeHtml(g.nome)}</div>
                            <div class="cap-recurso-medidas">
                                <span><b>${g.horasSugeridas.toFixed(1)}h</b> sugeridas / ${g.capacidadeInicial.toFixed(1)}h de capacidade (${pct}%)${resumoExtra.length ? ' — ' + resumoExtra.join(', ') : ''}</span>
                                <div class="cap-progress-bar"><div class="cap-progress-fill" style="width:${Math.min(pct,100)}%; background:${corBarra};"></div></div>
                            </div>
                        </div>
                        <table class="cap-recurso-table">
                            <thead><tr>
                                <th style="text-align:left;">Cliente</th>
                                <th style="text-align:left;">Cód.</th>
                                <th>HR Prev.</th>
                                <th>Fundido</th>
                                <th>Prazo Entrega</th>
                                <th>Status</th>
                            </tr></thead>
                            <tbody>${linhasItens}</tbody>
                        </table>
                    </div>`;
            }).join('');

            return `<div class="cap-recursos-lista">${cardsHtml}</div>`;
        }

        /* ==========================================================
           MODAL DE DETALHES DA MATRIZ DE DISPONIBILIDADE (clique)
           ========================================================== */
        let matrizModalEl = null;

        function getMatrizModalEl() {
            if (matrizModalEl) return matrizModalEl;

            matrizModalEl = document.createElement('div');
            matrizModalEl.className = 'matriz-modal-overlay';
            matrizModalEl.id = 'matrizModalOverlay';
            matrizModalEl.innerHTML = `
                <div class="matriz-modal-box" role="dialog" aria-modal="true" aria-labelledby="mmTitle">
                    <div class="matriz-modal-header">
                        <div>
                            <div class="matriz-modal-title" id="mmTitle"></div>
                            <div class="matriz-modal-sub" id="mmSub"></div>
                        </div>
                        <button type="button" class="matriz-modal-close" id="mmCloseBtn" aria-label="Fechar">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div class="matriz-modal-summary">
                        <div class="mms-item">
                            <span class="mms-label">Total de Operações</span>
                            <span class="mms-value" id="mmTotalOps">0</span>
                        </div>
                        <div class="mms-item">
                            <span class="mms-label">Horas Previstas (Total)</span>
                            <span class="mms-value" id="mmTotalHoras">0.0h</span>
                        </div>
                        <div class="mms-item">
                            <span class="mms-label">Ocupação</span>
                            <span class="mms-value" id="mmPct">0%</span>
                        </div>
                    </div>
                    <div class="matriz-modal-body" id="mmBody"></div>
                </div>`;
            document.body.appendChild(matrizModalEl);

            // Fechar: botão "X"
            matrizModalEl.querySelector('#mmCloseBtn').addEventListener('click', fecharModalMatriz);

            // Fechar: clique na área sombreada (fora da caixa)
            matrizModalEl.addEventListener('click', (e) => {
                if (e.target === matrizModalEl) fecharModalMatriz();
            });

            return matrizModalEl;
        }

        function abrirModalMatriz(td) {
            const el = getMatrizModalEl();

            const recursoId = td.dataset.recursoId || '';
            const recursoNome = td.dataset.recursoNome || '';
            const numSemana = td.dataset.semanaNum || '';
            const ano = td.dataset.ano || '2026';
            const pct = parseInt(td.dataset.pct) || 0;
            const cap = parseFloat(td.dataset.cap) || 0;

            // Busca no índice pré-construído: `${recursoId}_${numSemana}_${ano}` -> operações[]
            // O ano faz parte da chave para não misturar, por exemplo, semana 1/2026 com semana 1/2027.
            const ops = INDICE_CELULA[`${recursoId}_${numSemana}_${ano}`] || [];
            const totalHoras = ops.reduce((acc, op) => acc + (Number(op.hrPrev) || 0), 0);

            let pctClass = 'pct-ok';
            if (pct > 100) pctClass = 'pct-danger';
            else if (pct > 85) pctClass = 'pct-alert';

            el.querySelector('#mmTitle').innerHTML = `<i class="fa-solid fa-industry"></i> [${escapeHtml(recursoId)}] ${escapeHtml(recursoNome)}`;
            el.querySelector('#mmSub').textContent = `SEMANA ${numSemana}/${ano}`;
            el.querySelector('#mmTotalOps').textContent = ops.length;
            el.querySelector('#mmTotalHoras').textContent = `${totalHoras.toFixed(1)}h / ${cap.toFixed(1)}h`;
            const mmPct = el.querySelector('#mmPct');
            mmPct.textContent = `${pct}%`;
            mmPct.className = `mms-value ${pctClass}`;

            const corpo = el.querySelector('#mmBody');
            if (ops.length > 0) {
                let linhas = ops.map(op => {
                    const ordemPv = (op.cod && op.cod !== '-') ? op.cod : '—';
                    const horas = Number(op.hrPrev) || 0;
                    return `
                    <tr>
                        <td>${escapeHtml(op.cliente || 'Não informado')}</td>
                        <td>${escapeHtml(ordemPv)}</td>
                        <td>${escapeHtml(op.descricao || 'Sem descrição cadastrada')}</td>
                        <td>${escapeHtml(op.operacao || '—')}</td>
                        <td><span class="mmt-hr-badge">${horas.toFixed(1)}h</span></td>
                    </tr>`;
                }).join('');

                corpo.innerHTML = `
                    <table class="matriz-modal-table">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Ordem / PV</th>
                                <th>Descrição da Peça</th>
                                <th>Operação</th>
                                <th>HR Prev.</th>
                            </tr>
                        </thead>
                        <tbody>${linhas}</tbody>
                    </table>`;
            } else {
                corpo.innerHTML = '<div class="matriz-modal-empty"><i class="fa-solid fa-circle-info" style="font-size:28px; margin-bottom:10px; display:block;"></i>Sem descritivo de operações na Base para esta semana.</div>';
            }

            el.classList.add('is-open');
            document.body.style.overflow = 'hidden'; // trava o scroll de fundo enquanto o modal está aberto
        }

        function fecharModalMatriz() {
            if (matrizModalEl) matrizModalEl.classList.remove('is-open');
            document.body.style.overflow = '';
        }

        // Ativação: clique em qualquer célula com carga (%) na Matriz
        document.addEventListener('click', (e) => {
            const td = e.target.closest('.matriz-cell-click');
            if (td) abrirModalMatriz(td);
        });

        // Fechar com a tecla ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && matrizModalEl && matrizModalEl.classList.contains('is-open')) {
                fecharModalMatriz();
            }
        });
    </script>
</body>
</html>
